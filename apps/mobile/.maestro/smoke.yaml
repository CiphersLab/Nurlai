appId: com.nurlai.app
name: Nurlai mobile smoke
---
- launchApp:
    clearState: true

- assertVisible: "Sign up for Nurlai"
- assertVisible: "Name"
- tapOn: "Sign in"
- runFlow:
    when:
      true: ${typeof NURLAI_MOBILE_API_URL !== "undefined" && NURLAI_MOBILE_API_URL != null && NURLAI_MOBILE_API_URL.trim() !== ""}
    file: helpers/server.yaml
- assertVisible: "Sign in to Nurlai"
- tapOn: "Email"
- inputText: ${NURLAI_E2E_EMAIL}
- tapOn: "Password"
- inputText: ${NURLAI_E2E_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"

- extendedWaitUntil:
    visible: "Create"
    timeout: 30000
- tapOn: "Create"
- tapOn: "New bot"
- tapOn: "Name your Bot"
- inputText: "Smoke"
- tapOn: "Create"

- extendedWaitUntil:
    visible: "Message…"
    timeout: 30000
- tapOn: "Message…"
- inputText: ${NURLAI_E2E_MESSAGE}
- pressKey: Enter
- assertVisible: ${NURLAI_E2E_MESSAGE}

- tapOn: "Bot actions"
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "Open computer"
    timeout: 30000
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "You have control"
    timeout: 90000
- tapOn: "Close computer"
- tapOn: "Release"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 30000
